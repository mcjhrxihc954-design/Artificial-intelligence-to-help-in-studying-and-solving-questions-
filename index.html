<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معلمي الذكي - الصف الثالث إعدادي</title>
    <style>
        body { font-family: Arial; background: #f5f5f5; direction: rtl; margin:0; padding:0; }
        header { background:#4CAF50; color:white; padding:20px; text-align:center; }
        nav { background:#333; overflow:hidden; }
        nav a { float:right; color:white; padding:14px 20px; text-decoration:none; display:block; }
        nav a:hover { background:#ddd; color:black; }
        main { padding:20px; }
        #chatBox { border:1px solid #ccc; background:white; height:300px; overflow-y:scroll; padding:10px; }
        #userInput { width:80%; padding:10px; }
        #sendBtn { padding:10px; background:#4CAF50; color:white; border:none; }
        #sendBtn:hover { cursor:pointer; background:#45a049; }
    </style>
</head>
<body>
    <header>
        <h1>معلمي الذكي 🤖</h1>
        <p>موقع تعليم للصف الثالث إعدادي</p>
    </header>

    <nav>
        <a href="#">العلوم</a>
        <a href="#">الرياضيات</a>
        <a href="#">اللغة العربية</a>
        <a href="#">اللغة الإنجليزية</a>
    </nav>

    <main>
        <h2>اسأل معلمي الذكي</h2>
        <div id="chatBox">
            <p><strong>البوت:</strong> مرحبًا! أرسل سؤالك وسأشرحه لك.</p>
        </div>
        <input type="text" id="userInput" placeholder="اكتب سؤالك هنا...">
        <button id="sendBtn">إرسال</button>
    </main>

    <script>
        const chatBox = document.getElementById("chatBox");
        const userInput = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");

        const OPENAI_API_KEY = "ضع هنا مفتاح OpenAI API بتاعك"; // **مؤقت للتجربة**

        async function getAIResponse(question) {
            const response = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${OPENAI_API_KEY}`
                },
                body: JSON.stringify({
                    model: "gpt-4o",
                    messages: [
                        { role: "system", content: "أنت مدرس للصف الثالث إعدادي. اشرح ببساطة وباللغة العربية." },
                        { role: "user", content: question }
                    ],
                    temperature: 0.5,
                    max_tokens: 300
                })
            });
            const data = await response.json();
            return data.choices[0].message.content;
        }

        sendBtn.addEventListener("click", async () => {
            const userText = userInput.value.trim();
            if (!userText) return;

            // عرض رسالة الطالب
            const userMsg = document.createElement("p");
            userMsg.innerHTML = `<strong>أنت:</strong> ${userText}`;
            chatBox.appendChild(userMsg);

            // عرض رسالة انتظار
            const botMsg = document.createElement("p");
            botMsg.innerHTML = `<strong>البوت:</strong> ... جاري الرد`;
            chatBox.appendChild(botMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            // جلب رد GPT
            const answer = await getAIResponse(userText);
